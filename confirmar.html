<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirma tu asistencia — Kyara</title>
<meta name="description" content="Confirma tu asistencia a los XV Años de Kyara. 19 de diciembre de 2026, Jardín Blanc, Zona Río, Tijuana.">
<meta property="og:title" content="Confirma tu asistencia — Kyara">
<meta property="og:image" content="assets/invitacion.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F4F1EB; --brown:#432D21; --gold:#866344; --pill:#927252; --line:#E3D8CD; --gold-line:#B08A68; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--brown); }
  body { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.2rem; line-height: 1.5; }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; text-align: center; }
  .eyebrow { text-transform: uppercase; letter-spacing: .3em; font-size: .95rem; margin: 0; }
  h1 { font-family: "Great Vibes", cursive; font-weight: 400; color: var(--gold); font-size: 3.6rem; line-height: 1.1; margin: .2rem 0 0; }
  h2 { text-transform: uppercase; letter-spacing: .3em; font-weight: 500; font-size: 1.1rem; margin: 0 0 .5rem; }
  .divider { display: flex; align-items: center; gap: .75rem; color: var(--gold); margin: 1.5rem 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }
  .intro { font-style: italic; margin: 0 0 1.5rem; }
  .guest { border: 0; border-bottom: 1px solid var(--line); padding: 1rem 0; margin: 0; }
  .guest legend { text-transform: uppercase; letter-spacing: .25em; font-size: .85rem; color: var(--gold); padding: 0; }
  .fields { display: grid; gap: .9rem; grid-template-columns: 1fr 1fr; text-align: left; margin-top: .5rem; }
  @media (max-width: 30rem) { .fields { grid-template-columns: 1fr; } }
  label { display: block; text-transform: uppercase; letter-spacing: .2em; font-size: .8rem; margin-bottom: .25rem; }
  input {
    width: 100%; font: inherit; color: var(--brown); background: transparent;
    border: 0; border-bottom: 1px solid var(--gold-line); border-radius: 0; padding: .45rem 0; min-height: 44px;
  }
  input:focus-visible { outline: 2px solid #6e5340; outline-offset: 3px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem; min-height: 44px;
    font: inherit; text-transform: uppercase; letter-spacing: .25em; font-size: .95rem;
    border-radius: 999px; border: 1px solid var(--pill); padding: .7rem 1.8rem; cursor: pointer;
    transition: box-shadow .25s ease, background-color .25s ease;
  }
  .btn-main { background: var(--pill); color: var(--paper); }
  .btn-main:hover { box-shadow: 0 6px 22px rgba(120,86,58,.35); }
  .btn-ghost { background: transparent; color: var(--pill); }
  .btn-ghost:hover { background: rgba(146,114,82,.1); }
  .btn:focus-visible { outline: 2px solid #6e5340; outline-offset: 3px; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .actions { display: grid; gap: 1rem; justify-items: center; margin-top: 1.5rem; }
  .remove { background: none; border: 0; color: var(--gold); font: inherit; font-style: italic; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 .5rem; }
  .status { min-height: 1.5em; font-style: italic; margin: 1.25rem 0 0; }
  .status.error { color: #88492A; }
  .back { display: inline-block; margin-top: 2.5rem; color: var(--gold); text-transform: uppercase; letter-spacing: .25em; font-size: .85rem; text-decoration: none; padding: .75rem; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid #6e5340; outline-offset: 3px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Mis XV Años</p>
  <h1>Kyara</h1>
  <div class="divider" aria-hidden="true">✦</div>

  <section id="formSection">
    <h2>Confirma tu asistencia</h2>
    <p class="intro">Escribe el nombre de cada persona que asistirá.</p>

    <form id="rsvp" novalidate>
      <div id="guests"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="add">+ Agregar otro invitado</button>
        <button type="submit" class="btn btn-main" id="send">Confirmar →</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="thanks" hidden>
    <h2>¡Gracias!</h2>
    <p class="intro">Tu asistencia fue registrada. ¡Nos vemos el 19 de diciembre!</p>
  </section>

  <a class="back" href="index.html">← Volver a la invitación</a>
</main>

<template id="guestTpl">
  <fieldset class="guest">
    <legend>Invitado <span class="n"></span></legend>
    <div class="fields">
      <div><label>Nombre<input type="text" name="nombre" autocomplete="given-name" required></label></div>
      <div><label>Apellido<input type="text" name="apellido" autocomplete="family-name" required></label></div>
    </div>
    <button type="button" class="remove" hidden>Quitar invitado</button>
  </fieldset>
</template>

<script>
  // Paste the Web App URL from Google Apps Script (see apps-script.gs).
  var ENDPOINT = "";

  var guests = document.getElementById("guests");
  var tpl = document.getElementById("guestTpl");
  var statusEl = document.getElementById("status");
  var sendBtn = document.getElementById("send");

  function renumber() {
    var rows = guests.querySelectorAll(".guest");
    rows.forEach(function (row, i) {
      row.querySelector(".n").textContent = i + 1;
      row.querySelector(".remove").hidden = rows.length === 1;
    });
  }
  function addGuest() {
    var node = tpl.content.firstElementChild.cloneNode(true);
    node.querySelector(".remove").addEventListener("click", function () {
      node.remove(); renumber();
    });
    guests.appendChild(node);
    renumber();
    return node;
  }
  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  addGuest();
  document.getElementById("add").addEventListener("click", function () {
    addGuest().querySelector("input").focus();
  });

  document.getElementById("rsvp").addEventListener("submit", function (e) {
    e.preventDefault();
    var list = [];
    var bad = null;
    guests.querySelectorAll(".guest").forEach(function (row) {
      var n = row.querySelector('[name="nombre"]'), a = row.querySelector('[name="apellido"]');
      if (!n.value.trim() || !a.value.trim()) { bad = bad || (n.value.trim() ? a : n); return; }
      list.push({ nombre: n.value.trim(), apellido: a.value.trim() });
    });
    if (bad) { setStatus("Por favor completa nombre y apellido de cada invitado.", true); bad.focus(); return; }
    if (!ENDPOINT) { setStatus("El envío aún no está configurado.", true); return; }

    sendBtn.disabled = true;
    setStatus("Enviando…");
    var body = new URLSearchParams({ invitados: JSON.stringify(list) });
    // Apps Script doesn't send CORS headers; no-cors still delivers the POST.
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: body })
      .then(function () {
        document.getElementById("formSection").hidden = true;
        document.getElementById("thanks").hidden = false;
      })
      .catch(function () {
        sendBtn.disabled = false;
        setStatus("No se pudo enviar. Intenta de nuevo.", true);
      });
  });
</script>
</body>
</html>
